<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Computing Assignment 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Light Lemon Yellow Background */
            background-color: #FFFACD; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .carousel { 
            width: 100%; 
            max-width: 700px; 
            margin: 30px 0; 
            border: 8px solid white;
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .carousel-item img {
            height: 400px;
            object-fit: cover; /* Ensures images look good even if sizes differ */
        }
        .info-header { margin-bottom: 20px; }
        .dynamic-box { 
            background: white; 
            padding: 20px; 
            border-radius: 50px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="info-header text-center">
        <h1 class="display-5 fw-bold text-dark">Name: Diksha kale</h1>
        <h3 class="text-secondary">PRN: 1012412135</h3>
    </div>

    <div id="photoCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active"><img src="OIP.webp" class="d-block w-100" alt="Slide 1"></div>
            <div class="carousel-item"><img src="R.jpg" class="d-block w-100" alt="Slide 2"></div>
            <div class="carousel-item"><img src="s.webp" class="d-block w-100" alt="Slide 3"></div>
            <div class="carousel-item"><img src="t.webp" class="d-block w-100" alt="Slide 4"></div>
            <div class="carousel-item"><img src="u.avif" class="d-block w-100" alt="Slide 5"></div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#photoCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#photoCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div class="dynamic-box text-center">
        <span class="fw-bold">Current Server Time: </span>
        <span id="clock" class="text-danger fw-bold"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
